services:
  bot:
    build: .
    init: true
    restart: "no"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      AUTH_DIR: /app/auth_info
      KNOWLEDGE_DIR: /app/knowledge
    volumes:
      - bot_data:/app/data
      - bot_auth:/app/auth_info
      - ./knowledge:/app/knowledge:ro
volumes:
  bot_data:
  bot_auth:
